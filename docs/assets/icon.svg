<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ORM fact type with uniqueness constraint and mandatory role">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- mandatory role dot + connector -->
  <circle cx="25" cy="70" r="9" fill="#FBBF24"/>
  <path d="M34 70 H46" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- fact type: two adjoining role boxes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">
    <rect x="44" y="53" width="66" height="34" rx="4"/>
    <path d="M77 53 V87"/>
  </g>
  <!-- internal uniqueness constraint over the first role -->
  <path d="M46 41 H75" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
</svg>
